(() => {
  "use strict";
  var WORKER_URL = "https://govai-demo-worker.2jgbvj688y.workers.dev";

  var form = document.querySelector(".demo-form");
  if (!form) return;

  var submitBtn = form.querySelector('button[type="submit"]');
  var submitLabel = submitBtn ? submitBtn.textContent : "";

  var status = document.createElement("p");
  status.className = "demo-status";
  status.setAttribute("role", "status");
  status.style.marginTop = "1rem";
  status.style.fontSize = "0.92rem";
  form.appendChild(status);

  function setStatus(text, kind) {
    status.textContent = text;
    status.dataset.kind = kind || "";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
    }
    setStatus("", "");

    var data = Object.fromEntries(new FormData(form).entries());

    fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    })
      .then(function (res) {
        return res.json().then(function (json) {
          return { ok: res.ok, json: json };
        });
      })
      .then(function (result) {
        if (result.ok) {
          form.reset();
          setStatus("Thanks - we'll be in touch shortly.", "success");
        } else {
          setStatus((result.json && result.json.error) || "Something went wrong. Please try again.", "error");
        }
      })
      .catch(function () {
        setStatus("Something went wrong. Please check your connection and try again.", "error");
      })
      .finally(function () {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = submitLabel;
        }
      });
  });
})();
</script></body>
